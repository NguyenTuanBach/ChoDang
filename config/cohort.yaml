# Cấu hình đợt thực tập — nguồn dữ liệu khi KHÔNG bật vai trò Quản trị viên (R4.1).
# Ngày dạng tương đối (+/- số ngày so với ngày seed) để dữ liệu demo luôn "đang diễn ra".
cohort:
  code: TT-2026-HK1
  name: Thực tập doanh nghiệp HK1 2026–2027
  start_window_offset_days: -60
  end_window_offset_days: 150
  min_weeks: 8
  hours_per_week: 32

# Chuẩn đầu ra học phần thực tập — dùng cho gợi ý "CĐR chưa nhắc tới" (R3.2)
outcomes:
  - code: CLO1
    text: Vận dụng kiến thức chuyên ngành để giải quyết vấn đề thực tế tại doanh nghiệp
    keywords: [vận dụng, giải quyết, phân tích, thiết kế, xây dựng, phát triển]
  - code: CLO2
    text: Làm việc nhóm và giao tiếp chuyên nghiệp trong môi trường doanh nghiệp
    keywords: [nhóm, giao tiếp, họp, trình bày, phối hợp]
  - code: CLO3
    text: Tuân thủ quy trình, quy định và đạo đức nghề nghiệp
    keywords: [quy trình, quy định, đạo đức, bảo mật, tuân thủ]
  - code: CLO4
    text: Viết báo cáo kỹ thuật và tự đánh giá quá trình học tập
    keywords: [báo cáo, tài liệu, tự đánh giá, nhật ký]

# Mẫu mốc — anchor: start | mid | end, offset_days so với anchor
milestones:
  - code: tiep_nhan
    name: Nộp giấy xác nhận tiếp nhận của doanh nghiệp
    anchor: start
    offset_days: 7
    required_evidence: [acceptance_letter]
    citation: {doc: QĐ-TT/2026, path: Điều 7 / Khoản 1}
  - code: de_cuong
    name: Đề cương thực tập được duyệt
    anchor: start
    offset_days: 14
    required_evidence: []
    linked_to: outline
    citation: {doc: QĐ-TT/2026, path: Điều 6 / Khoản 2}
  - code: giua_ky
    name: Nộp báo cáo giữa kỳ
    anchor: mid
    offset_days: 0
    required_evidence: [midterm_report]
    citation: {doc: QĐ-TT/2026, path: Điều 7 / Khoản 2}
  - code: danh_gia_dn
    name: Nộp phiếu đánh giá của doanh nghiệp (bản ký)
    anchor: end
    offset_days: 0
    required_evidence: [company_evaluation]
    citation: {doc: QĐ-TT/2026, path: Điều 9 / Khoản 1}
  - code: cuoi_ky
    name: Nộp báo cáo cuối kỳ
    anchor: end
    offset_days: 7
    required_evidence: [final_report]
    citation: {doc: QĐ-TT/2026, path: Điều 7 / Khoản 3}

rules:
  extension:
    max_days: 14
    request_grace_days: 3  # gửi trước hoặc chậm nhất 3 ngày sau hạn mốc
    citation: {doc: QĐ-TT/2026, path: Điều 10 / Khoản 2}
  validation:
    - id: required_fields
      check: required_fields
      params:
        fields: [company_name, company_tax_code, position, job_description, start_date, end_date, mentor_name, mentor_email]
      citation: {doc: QĐ-TT/2026, path: Điều 5 / Khoản 1}
    - id: end_after_start
      check: end_after_start
      citation: {doc: QĐ-TT/2026, path: Điều 5 / Khoản 2}
    - id: min_weeks
      check: duration_weeks_gte
      citation: {doc: QĐ-TT/2026, path: Điều 5 / Khoản 2}
    - id: within_window
      check: within_window
      citation: {doc: QĐ-TT/2026, path: Điều 5 / Khoản 3}
  monitor:
    - id: due_soon
      check: milestone_due_within
      params: {days: 3}
      severity: info
    - id: overdue
      check: milestone_overdue
      severity: warning
    - id: missing_evidence
      check: evidence_types_missing
      severity: warning
    - id: low_hours
      check: cumulative_hours_below_expected
      params: {tolerance: 0.8, min_weeks_elapsed: 2}
      severity: warning
    # Nhắc SV (info → chỉ SV nhận thông báo). Tuần N phải ghi trong grace_days ngày sau khi tuần kết thúc.
    - id: log_missing
      check: weekly_log_missing
      params: {grace_days: 2}
      severity: info
      citation: {doc: QĐ-TT/2026, path: Điều 8 / Khoản 1}

# Điểm ưu tiên hàng chờ duyệt của GV (src/services/priority.py) — chỉ để SẮP XẾP, không tự quyết.
priority:
  base: {extensions: 20, internships: 15, outlines: 15, milestones: 10, logs: 0}
  deadline_overdue: 50   # hạn liên quan đã qua
  deadline_soon: 30      # hạn còn ≤ deadline_days ngày
  deadline_days: 3
  start_soon: 30         # hồ sơ chờ duyệt, ngày bắt đầu còn ≤ start_days ngày
  start_days: 7
  wait_per_day: 2
  wait_cap: 20
  risk_per_flag: 10      # mỗi cờ warning/critical đang mở của SV
  risk_cap: 20
  levels: {high: 50, medium: 25}

# AI hỗ trợ đọc minh chứng (src/services/evidence_review.py) — GỢI Ý cho GV, không tự duyệt.
# Checklist do khoa cấu hình: tìm từ khóa (không dấu cũng khớp) trong nội dung file.
# `citation` chỉ ghi khi quy chế thật sự có quy định; báo cáo giữa/cuối kỳ quy chế không quy định nội dung.
evidence_review:
  min_text_chars: 200   # ít chữ hơn → cảnh báo "gần như không có chữ" (ảnh chụp/scan mờ)
  checklists:
    acceptance_letter:
      citation: {doc: QĐ-TT/2026, path: Điều 7 / Khoản 1}
      items:
        - {item: Có tên doanh nghiệp tiếp nhận, keywords: [công ty, doanh nghiệp, tiếp nhận]}
        - {item: Có thời gian thực tập, keywords: [từ ngày, đến ngày, thời gian thực tập]}
        - {item: Có phần xác nhận của doanh nghiệp, keywords: [xác nhận, ký tên, giám đốc, đại diện]}
    midterm_report:
      items:
        - {item: Mô tả công việc đã làm, keywords: [công việc, nhiệm vụ, đã thực hiện, triển khai]}
        - {item: Kết quả đạt được, keywords: [kết quả, hoàn thành, đạt được, sản phẩm]}
        - {item: Khó khăn và cách xử lý, keywords: [khó khăn, vướng mắc, giải pháp, hướng xử lý]}
        - {item: Kế hoạch giai đoạn tiếp theo, keywords: [kế hoạch, tiếp theo, giai đoạn sau, dự kiến]}
    final_report:
      items:
        - {item: Tổng kết công việc đã làm, keywords: [công việc, nhiệm vụ, đã thực hiện, tổng kết]}
        - {item: Kết quả và sản phẩm, keywords: [kết quả, sản phẩm, hoàn thành, đạt được]}
        - {item: Tự đánh giá, keywords: [tự đánh giá, đánh giá bản thân, ưu điểm, hạn chế]}
        - {item: Bài học kinh nghiệm, keywords: [bài học, kinh nghiệm, rút ra]}
    company_evaluation:
      citation: {doc: QĐ-TT/2026, path: Điều 9 / Khoản 1}
      items:
        - {item: Có phần nhận xét / đánh giá, keywords: [nhận xét, đánh giá, xếp loại, điểm]}
        - {item: Có thông tin người hướng dẫn ký, keywords: [người hướng dẫn, ký tên, xác nhận]}

evidence_types:
  acceptance_letter: Giấy xác nhận tiếp nhận
  midterm_report: Báo cáo giữa kỳ
  company_evaluation: Phiếu đánh giá của doanh nghiệp
  final_report: Báo cáo cuối kỳ
  other: Tài liệu khác
