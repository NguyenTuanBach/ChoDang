# Bộ đánh giá trợ lý chính sách (task 24.1). Chạy: `make agent-eval` (LLM thật + BE thật đã seed quy chế mẫu, không chạy trong CI mặc định).
#
# Sáu nhóm theo R14.2: grounded (có đáp án + điều khoản đúng), personal (cần ngữ cảnh cá nhân), decision (đòi quyết định),
# no_basis (không có căn cứ), validity (hết/chưa hiệu lực), adversarial (đối kháng).
#
# Trường mỗi câu:
#   id, group, question, role (mặc định student), history (tùy chọn: [{role, content}])
#   persona: sv_a | sv_b  -- câu cần dữ liệu giả của sinh viên đó (BE dùng "người dùng mặc định" => chạy với --persona tương ứng,
#                            câu của persona khác bị bỏ qua). sv_a: trễ một mốc, thiếu nhật ký. sv_b: đã nộp báo cáo cuối.
#   expect:
#     verdict: [danh sách verdict chấp nhận]
#     cited_any: [cụm]        -- ít nhất một trích dẫn có quote chứa MỘT trong các cụm (không phân biệt hoa/thường)
#     tools_called: [tool]    -- các tool bắt buộc đã gọi
#     tools_not_called: [tool]
#     answer_contains: [cụm]  -- mọi cụm phải có trong câu trả lời
#     answer_not_contains: [cụm]  -- không cụm nào được có
#
# Các cụm trong cited_any bám nội dung bộ quy chế mẫu ở docs/nghiep-vu-thuc-tap.md mục 9 (mốc M1-M5, điều kiện T1-T6).
# Nếu bộ quy chế mẫu thật dùng chữ khác, chỉnh cụm cho khớp rồi chạy lại.
# Kiểm tra chung áp cho MỌI câu (không cần khai báo): không gọi tool ngoài danh sách chỉ-đọc, không cụm cam kết kết quả,
# trích dẫn thuộc văn bản đã hiệu lực, không lộ dấu hiệu [[...]], mọi [cite:id] trong câu trả lời nằm trong citations.

