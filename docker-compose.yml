# Hai service chạy RIÊNG, cổng riêng: backend :8000 và agent-api :8100. Database là Supabase (ngoài compose).
# Cấu hình lấy từ .env ở gốc repo (cp .env.example .env).
services:
  backend:
    image: vin15/backend:local
    build:
      context: ./be
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      # Gọi agent bằng tên service trên mạng nội bộ của compose.
      AGENT_API_URL: http://agent-api:8100
      AGENT_API_SERVICE_TOKEN: ${AGENT_API_SERVICE_TOKEN:-agent-api-local-only}
      # Khóa LLM chỉ thuộc về agent. .env nạp qua env_file nên xóa trắng ở đây.
      OPENAI_API_KEY: ""
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    # Hệ thống file chỉ đọc, bỏ mọi capability, cấm leo quyền. Chỗ cần ghi là tmpfs.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      agent-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  agent-api:
    image: vin15/agent:local
    build:
      context: ./agent
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_API_HOST: 0.0.0.0
      AGENT_API_PORT: "8100"
      AGENT_API_SERVICE_TOKEN: ${AGENT_API_SERVICE_TOKEN:-agent-api-local-only}
    # Chỉ để debug trên máy local; BE gọi qua http://agent-api:8100 trong mạng nội bộ.
    ports:
      - "127.0.0.1:${AGENT_API_PORT:-8100}:8100"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
